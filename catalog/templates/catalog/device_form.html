{% extends 'catalog/base.html' %}
{% block content %}
<h1>{% if form.instance.pk %}Изменить устройство{% else %}Новое устройство{% endif %}</h1>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Сохранить</button>
  <a class="btn btn-secondary" href="{% url 'catalog:device_list' %}">Отмена</a>
</form>
{% endblock %}
