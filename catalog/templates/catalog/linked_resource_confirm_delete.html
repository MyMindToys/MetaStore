{% extends 'catalog/base.html' %}
{% block content %}
<h1>Удалить связь</h1>
<p>Убрать «<strong>{{ object.title }}</strong>» из материала <a href="{% url 'catalog:material_detail' material.pk %}">{{ material.file_name }}</a>?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Удалить</button>
  <a class="btn btn-secondary" href="{% url 'catalog:material_detail' material.pk %}">Отмена</a>
</form>
{% endblock %}
