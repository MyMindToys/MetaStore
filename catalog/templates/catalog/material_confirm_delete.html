{% extends 'catalog/base.html' %}
{% block content %}
<h1>Удалить материал</h1>
<p>Удалить «<strong>{{ object.file_name }}</strong>» и все связи?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Удалить</button>
  <a class="btn btn-secondary" href="{% url 'catalog:material_detail' object.pk %}">Отмена</a>
</form>
{% endblock %}
