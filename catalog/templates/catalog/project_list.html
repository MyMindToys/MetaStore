{% extends 'catalog/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Проекты</h1>
  <a class="btn btn-primary" href="{% url 'catalog:project_create' %}">Создать проект</a>
</div>
<table class="table table-striped">
  <thead>
    <tr><th>Название</th><th>Описание</th><th>Файлов</th></tr>
  </thead>
  <tbody>
    {% for project in projects %}
    <tr>
      <td><a href="{% url 'catalog:project_detail' project.pk %}">{{ project.name }}</a></td>
      <td>{{ project.description|default:'—' }}</td>
      <td>{{ project.files.count }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="3">Проектов пока нет.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
