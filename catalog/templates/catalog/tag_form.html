{% extends 'catalog/base.html' %}
{% block content %}
<h1>{% if form.instance.pk %}Edit Tag{% else %}Create Tag{% endif %}</h1>
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn btn-secondary" href="{% url 'catalog:file_create' %}">Back</a>
</form>
{% endblock %}
