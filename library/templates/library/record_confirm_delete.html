{% extends "catalog/base.html" %}
{% block content %}
<h1>Удалить запись</h1>
<p>Вы уверены, что хотите удалить «{{ object }}»?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Удалить</button>
  <a class="btn btn-secondary" href="{% url 'library:record_list' %}">Отмена</a>
</form>
{% endblock %}
