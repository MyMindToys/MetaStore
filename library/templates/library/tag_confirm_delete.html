{% extends "catalog/base.html" %}
{% block content %}
<h1>Удалить тег</h1>
<p>Удалить тег «{{ object.name }}»?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Удалить</button>
  <a class="btn btn-secondary" href="{% url 'library:tag_list' %}">Отмена</a>
</form>
{% endblock %}
