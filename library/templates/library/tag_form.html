{% extends "catalog/base.html" %}
{% block content %}
<h1>{% if object %}Редактировать тег{% else %}Новый тег{% endif %}</h1>
<form method="post" class="mt-3">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Сохранить</button>
  <a class="btn btn-secondary" href="{% url 'library:tag_list' %}">Отмена</a>
</form>
{% endblock %}
