{% extends "catalog/base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Теги библиографии</h1>
  <a class="btn btn-primary" href="{% url 'library:tag_add' %}">Новый тег</a>
</div>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Название</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for tag in object_list %}
      <tr>
        <td>{{ tag.name }}</td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-primary" href="{% url 'library:tag_edit' tag.pk %}">Редактировать</a>
          <a class="btn btn-sm btn-outline-danger" href="{% url 'library:tag_delete' tag.pk %}">Удалить</a>
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="2" class="text-center">Нет тегов</td></tr>
    {% endfor %}
  </tbody>
</table>
{% include "catalog/pagination.html" %}
<a class="btn btn-secondary" href="{% url 'library:record_list' %}">Назад к записям</a>
{% endblock %}
