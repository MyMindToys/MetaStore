[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metastore-scanner"
version = "0.1.0"
description = "CLI agent for scanning local filesystems and syncing metadata to MetaStore server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.8"]

[project.scripts]
metastore-scanner = "scanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*"]
